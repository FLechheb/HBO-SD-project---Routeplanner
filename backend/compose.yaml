services:
  postgres:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=mydatabase'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=myuser'
    ports:
      - '5432:5432'

  otp:
    profiles: ['otp']
    labels:
      org.springframework.boot.ignore: 'true'
    image: 'opentripplanner/opentripplanner@sha256:36bdb5d57a5435d6da34f2adde18da62b338acfc465a9c0345ce64f74e355a0c'
    command: ['--load', '--serve']
    environment:
      - 'JAVA_TOOL_OPTIONS=-Xmx4g'
    volumes:
      - './otp-data:/var/opentripplanner'
    ports:
      - '8086:8080'
